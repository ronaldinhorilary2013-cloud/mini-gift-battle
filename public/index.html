<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b14">
<title>Mini Gift Battle - ADM</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b14;color:#fff;font-family:Arial,sans-serif;padding:18px}
main{max-width:750px;margin:auto}
header{padding:18px 0;border-bottom:1px solid #283248;margin-bottom:22px}
h1{font-size:25px;margin:0}
h1 span{color:#a855f7}
small,.muted{color:#929bb0}
.panel{background:#111725;border:1px solid #283248;border-radius:16px;padding:18px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 16px}
label{display:block;font-size:12px;color:#aab4c8;margin:13px 0 7px}
input,textarea{width:100%;background:#080e1b;border:1px solid #303c53;border-radius:9px;padding:12px;color:white;font-size:15px}
input[type=color]{height:45px;padding:4px}
textarea{min-height:90px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{border:0;border-radius:10px;padding:13px;background:#7c3aed;color:white;font-weight:bold;font-size:14px;margin:5px 3px 5px 0}
button.secondary{background:#27344a}
button.danger{background:#b42335}
button.green{background:#16834b}
a{color:#a78bfa}
.preview{width:75px;height:75px;border-radius:50%;object-fit:cover;background:#27344a;margin-top:10px}
.message{color:#65e6a0;font-size:13px;margin-top:12px}
@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header>
<h1>MINI <span>GIFT</span> BATTLE</h1>
<p class="muted">PAINEL ADMINISTRATIVO</p>
<a href="/overlay" target="_blank">Abrir placar da LIVE ↗</a>
</header>

<section class="panel">
<h2>Configuração da transmissão</h2>
<label>Título da batalha</label>
<input id="title" value="MINI GIFT BATTLE">
<label>Usuário do TikTok (sem @ opcional)</label>
<input id="username" placeholder="usuario_tiktok">
<label>Tempo da batalha</label>
<div class="grid">
<div><label>Horas</label><input id="hours" type="number" min="0" value="0"></div>
<div><label>Minutos</label><input id="minutes" type="number" min="0" value="5"></div>
<div><label>Segundos</label><input id="seconds" type="number" min="0" max="59" value="0"></div>
</div>
</section>

<div class="grid">
<section class="panel">
<h2>🔴 Participante 1</h2>
<label>Nome</label>
<input id="name0" value="PARTICIPANTE 1">
<label>Foto de perfil</label>
<input id="photo0" type="file" accept="image/*">
<img id="preview0" class="preview" alt="Foto 1">
<label>Cor</label>
<input id="color0" type="color" value="#ef4444">
<label>Comando de voto no chat</label>
<input id="command0" value="13">
<label>Presentes e pontos</label>
<textarea id="gifts0">Rosa|1
Presente|5</textarea>
<small>Um por linha. Formato: nome|pontos</small>
</section>

<section class="panel">
<h2>🔵 Participante 2</h2>
<label>Nome</label>
<input id="name1" value="PARTICIPANTE 2">
<label>Foto de perfil</label>
<input id="photo1" type="file" accept="image/*">
<img id="preview1" class="preview" alt="Foto 2">
<label>Cor</label>
<input id="color1" type="color" value="#3b82f6">
<label>Comando de voto no chat</label>
<input id="command1" value="22">
<label>Presentes e pontos</label>
<textarea id="gifts1">Rosa Branca|1
Presente|5</textarea>
<small>Um por linha. Formato: nome|pontos</small>
</section>
</div>

<section class="panel">
<h2>Controles da batalha</h2>
<p>Status TikTok: <strong id="liveStatus">DESCONECTADO</strong></p>
<p>Tempo: <strong id="adminTimer">00:05:00</strong></p>
<button id="saveConfig" class="green">SALVAR CONFIGURAÇÕES</button>
<button id="connectLive">CONECTAR TIKTOK LIVE</button>
<div>
<button id="startTimer" class="green">INICIAR</button>
<button id="pauseTimer" class="secondary">PAUSAR</button>
<button id="resumeTimer" class="secondary">CONTINUAR</button>
<button id="resetTimer" class="secondary">REINICIAR TEMPO</button>
<button id="resetScores" class="danger">ZERAR PONTOS</button>
</div>
<div id="message" class="message"></div>
</section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="/admin.js"></script>
</body>
</html>
